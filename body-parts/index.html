<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parts of the Body</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,600;1,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --bg:#fbf6ee;--paper:#fffdf9;--ink:#2f3a33;--muted:#6f7a72;--line:#e7ddcf;
  --green:#5d8f4c;--green-bg:#eaf3e2;--blue:#4b78a8;--blue-bg:#e5effa;
  --purple:#7d5aa8;--purple-bg:#f1eaf8;--rose:#b4566a;--rose-bg:#fbe9ec;
  --ok:#3f9a5a;--ok-bg:#e3f4e6;--bad:#cf5b5b;--bad-bg:#fbe5e3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Nunito",system-ui,sans-serif;min-height:100vh}
.decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.decor svg{position:absolute;opacity:.6}
main{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:28px 16px 60px}
header{text-align:center;margin-bottom:18px}
.kicker{display:inline-block;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);background:var(--green-bg);padding:4px 14px;border-radius:99px}
h1{font:italic 700 clamp(34px,6vw,52px)/1.1 "Lora",Georgia,serif;margin:12px 0 6px;color:#2c4a32}
.sub{margin:0;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 26px}
nav a{font-size:14px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:6px 12px;border-radius:99px}
nav a:hover{border-color:var(--green)}
.ex{--c:var(--green);--cb:var(--green-bg);background:var(--paper);border:2px solid var(--cb);border-radius:22px;padding:20px 20px 22px;margin:0 0 26px;box-shadow:0 6px 20px rgba(80,60,30,.06);scroll-margin-top:12px}
.c-blue{--c:var(--blue);--cb:var(--blue-bg)}.c-purple{--c:var(--purple);--cb:var(--purple-bg)}.c-rose{--c:var(--rose);--cb:var(--rose-bg)}
.ex-head{display:flex;align-items:center;gap:12px;margin:-4px 0 6px}
.num{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--cb);color:var(--c);font:italic 700 20px "Lora",serif}
h2{margin:0;font:italic 700 26px/1.2 "Lora",Georgia,serif;color:var(--c)}
.instr{margin:0 0 14px;color:var(--muted)}
.instr b{color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{font:inherit;font-size:15px;font-weight:700;cursor:pointer;border:1.5px solid var(--cb);background:var(--paper);color:var(--c);padding:7px 14px;border-radius:12px}
.btn:hover{background:var(--cb)}
.btn.main{background:var(--c);border-color:var(--c);color:#fff}
.btn.main:hover{filter:brightness(1.08)}
.result{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--cb);font-weight:800;font-size:18px;animation:pop .35s}
@keyframes pop{from{transform:scale(.96);opacity:0}}
/* flashcards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fc{position:relative;min-height:118px;cursor:pointer;perspective:700px}
.fc .face{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;backface-visibility:hidden;transition:transform .45s;border:1.5px solid var(--cb)}
.fc .front{background:var(--paper)}
.fc .back{background:var(--cb);transform:rotateY(180deg)}
.fc.flip .front{transform:rotateY(-180deg)}.fc.flip .back{transform:rotateY(0)}
.fc b{font-size:18px;line-height:1.25}.fc i{font-style:normal;font-size:13px;color:var(--muted);margin-top:3px}
.fc .ex-s{font-style:italic;font-size:13px;color:var(--c);margin-top:5px}
.fc .emo{font-size:26px;line-height:1;margin-bottom:4px}
/* mcq */
.q{padding:12px 0;border-top:1px dashed var(--line)}
.q:first-child{border-top:0}
.qt{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.qt em{font-style:normal;font-weight:800;color:var(--c)}
.pic{font-size:30px;line-height:1}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-size:16px;cursor:pointer;border:1.5px solid var(--line);background:#fff;padding:7px 14px;border-radius:12px;color:var(--ink)}
.opt:hover{border-color:var(--c)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:#1f5e33;font-weight:700}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:#8f2f2f;text-decoration:line-through}
.chat .qt span:last-child{background:var(--cb);padding:8px 14px;border-radius:4px 16px 16px 16px}
.chat .opts{justify-content:flex-end}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:8px}
.tile{font:inherit;font-size:16px;cursor:pointer;text-align:left;border:1.5px solid var(--line);background:#fff;padding:10px 14px;border-radius:12px;color:var(--ink);transition:.2s}
.tile:hover{border-color:var(--c)}
.tile.sel{border-color:var(--c);background:var(--cb);transform:scale(1.02)}
.tile.ok{background:var(--ok-bg);border-color:var(--ok);opacity:.65;cursor:default}
.tile.bad{background:var(--bad-bg);border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* gaps & label */
.bank{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-radius:14px;background:var(--cb);margin-bottom:14px}
.bank span{background:#fff;border-radius:8px;padding:2px 10px;font-weight:700;font-size:15px;color:var(--c)}
.text{line-height:2.3;font-size:17px}
select,.spell input{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:3px 6px;background:#fff;color:var(--ink)}
select.ok,input.ok{border-color:var(--ok);background:var(--ok-bg)}
select.bad,input.bad{border-color:var(--bad);background:var(--bad-bg)}
.fix{display:inline-block;margin-left:6px;font-size:14px;font-weight:800;color:var(--ok)}
.fix::before{content:"→ "}
.label{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:center}
.fig svg{width:100%;height:auto;display:block}
.labs{margin:0;padding-left:30px;display:grid;gap:7px}
.labs li{font-weight:800;color:var(--c)}
.labs li::marker{font-weight:800}
.mk{fill:#fff;stroke:var(--c);stroke-width:2}.mt{font:800 13px Nunito,sans-serif;fill:var(--c);text-anchor:middle}
.ld{stroke:var(--c);stroke-width:1.2;opacity:.55}.dot{fill:var(--c)}
/* order */
.orow{padding:12px 0;border-top:1px dashed var(--line);display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.orow:first-child{border-top:0}
.orow em{font-style:normal;font-weight:800;color:var(--c)}
.answ{display:flex;align-items:center;gap:4px}
.ans{flex:1;min-height:44px;display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1.5px dashed var(--cb);border-radius:12px;background:#fff}
.ans.ok{border:1.5px solid var(--ok);background:var(--ok-bg)}
.ans.bad{border:1.5px solid var(--bad);background:var(--bad-bg)}
.end{font-weight:800;font-size:20px}
.pool{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:16px;cursor:pointer;border:1.5px solid var(--cb);background:var(--cb);color:var(--ink);padding:5px 11px;border-radius:10px}
.ans .chip{background:#fff;border-color:var(--c)}
.ofix{grid-column:2;font-size:14px;font-weight:800;color:var(--ok)}
/* spell */
.spell{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.spell label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--cb);padding:8px 10px;border-radius:12px}
.spell span{flex:1 1 100px;font-weight:700}
.spell input{width:130px}
/* reading */
.read{background:var(--cb);border-radius:16px;padding:14px 18px;margin-bottom:12px;line-height:1.7}
.read p{margin:.4em 0}
footer{text-align:center;color:var(--muted);font-size:14px;margin-top:34px}
@media (max-width:680px){
  body{font-size:16px}
  .decor svg{opacity:.25}
  .ex{padding:16px 14px 18px}
  h2{font-size:22px}
  .label{grid-template-columns:1fr}
  .match{gap:8px}.tile{font-size:15px;padding:9px 10px}
}
.spk{border:0;background:none;cursor:pointer;font-size:18px;padding:2px 4px;border-radius:8px;line-height:1}
.spk:hover{background:var(--cb)}
.spk.corner{position:absolute;top:4px;right:4px;font-size:16px}
.qt .spk{margin-left:auto}
.fc{min-height:168px}
.fc .img{width:84px;height:84px;margin-bottom:4px}
.fc .img svg{width:100%;height:100%;display:block;border-radius:50%;background:#fbf3e6}
.hl{fill:rgba(230,90,90,.28);stroke:#e05a5a;stroke-width:2.5;animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.18)}}

function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[—\/…]/g,', ').replace(/___/g,'blank'));if(VOICE)u.voice=VOICE;u.lang=VOICE?VOICE.lang:'en-GB';u.rate=.9;speechSynthesis.speak(u);}catch(e){}}
const HAS_TTS='speechSynthesis' in window;
const sp=(t,cls='spk')=>HAS_TTS?$('button',{class:cls,title:'Listen','aria-label':'Listen',onclick(e){e.stopPropagation();speak(typeof t==='function'?t():t);}},'🔊'):null;
const COLORS=['green','blue','purple','rose'];
const score=(ok,t)=>`${ok} / ${t} — ${ok===t?'🎉 Excellent!':ok>=t*.7?'👍 Good job!':'💪 Try again!'}`;
function result(body,text,render){body.querySelector(':scope > .result')?.remove();body.append($('div',{class:'result'},$('span',{},text),$('button',{class:'btn',onclick:render},'↻ Again')));}
function grade(els){let ok=0;els.forEach(el=>{const n=el.nextElementSibling;if(n&&n.classList.contains('fix'))n.remove();const ans=el.dataset.a.split('|');const g=ans.some(a=>norm(a)===norm(el.value));el.classList.toggle('ok',g);el.classList.toggle('bad',!g);if(g)ok++;else el.after($('span',{class:'fix'},ans[0]));});return[ok,els.length];}
function checker(body,fn,render){return $('div',{class:'bar'},$('button',{class:'btn main',onclick(){const[ok,t]=fn();result(body,score(ok,t),render);}},'✓ Check'));}
const sel=(words,a)=>{const s=$('select',{},$('option',{value:''},'…'),...words.map(w=>$('option',{value:w},w)));s.dataset.a=a;return s;};

const R={
flash(s,body){
  let back=false,cards=s.cards.slice();const grid=$('div',{class:'cards'});
  const draw=()=>{grid.innerHTML='';cards.forEach(c=>{const f=$('div',{class:'fc'+(back?' flip':''),onclick(){f.classList.toggle('flip');}},
    $('div',{class:'face front'},sp(c.say||(c.en+(c.ex?'. '+c.ex:'')),'spk corner'),c.img?$('div',{class:'img',html:c.img}):c.emo?$('div',{class:'emo'},c.emo):null,$('b',{},c.en),c.tr?$('i',{},c.tr):null,c.ex?$('div',{class:'ex-s'},c.ex):null),
    $('div',{class:'face back'},$('b',{},c.ru)));grid.append(f);});};
  body.append($('div',{class:'bar'},
    $('button',{class:'btn',onclick(){cards=shuffle(cards);draw();}},'🔀 Shuffle'),
    $('button',{class:'btn',onclick(){back=!back;draw();}},'🔁 RU ↔ EN'),
    $('button',{class:'btn',onclick(){cards=s.cards.slice();back=false;draw();}},'↺ Reset')),grid);draw();
},
mcq(s,body,render){
  let ok=0,done=0;const items=s.keepItems?s.items:shuffle(s.items);const list=$('div',{class:'mcq '+(s.style||'')});
  items.forEach((it,k)=>{
    const ans=it.opts[it.a||0];const opts=s.keepOpts?it.opts:shuffle(it.opts);
    const row=$('div',{class:'q'},$('div',{class:'qt'},it.pic?$('span',{class:'pic'},it.pic):null,$('span',{html:`<em>${k+1}.</em> ${it.q}`}),s.style==='chat'?sp(it.q):null));
    const ob=$('div',{class:'opts'});
    opts.forEach(o=>{const b=$('button',{class:'opt',onclick(){if(row.dataset.d)return;row.dataset.d=1;done++;
      if(o===ans){b.classList.add('ok');ok++;}else{b.classList.add('bad');[...ob.children].find(x=>x.textContent===ans).classList.add('ok');}
      if(done===items.length)result(body,score(ok,items.length),render);}},o);ob.append(b);});
    row.append(ob);list.append(row);});
  body.append(list);
},
match(s,body,render){
  const pairs=shuffle(s.pairs).slice(0,s.take||s.pairs.length);let cur=null,left=pairs.length,miss=0;
  const A=$('div',{class:'col'}),B=$('div',{class:'col'});
  const mk=(txt,id,side)=>{const b=$('button',{class:'tile',onclick(){
    if(b.disabled)return;if(side==='A'&&s.speakA!==false)speak(txt);
    if(!cur||cur.side===side){if(cur)cur.b.classList.remove('sel');cur={b,id,side};b.classList.add('sel');return;}
    const p=cur.b;cur=null;
    if(p.dataset.id===String(id)){[p,b].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.disabled=true;});
      if(--left===0)result(body,miss===0?'🎉 Perfect! No mistakes.':`✅ All matched! Mistakes: ${miss}`,render);}
    else{miss++;[p,b].forEach(x=>{x.classList.add('bad');setTimeout(()=>x.classList.remove('bad','sel'),450);});}
  }},txt);b.dataset.id=id;return b;};
  shuffle(pairs.map((p,i)=>[p[0],i])).forEach(([t,i])=>A.append(mk(t,i,'A')));
  shuffle(pairs.map((p,i)=>[p[1],i])).forEach(([t,i])=>B.append(mk(t,i,'B')));
  body.append($('div',{class:'match'},A,B));
},
gaps(s,body,render){
  const words=[...s.bank].sort();body.append($('div',{class:'bank'},...shuffle(s.bank).map(w=>$('span',{},w))));
  const p=$('div',{class:'text'}),sels=[];
  s.text.split(/(\{[^}]+\})/).forEach(part=>{const m=part.match(/^\{(.+)\}$/);
    if(m){const x=sel(words,m[1]);sels.push(x);p.append(x);}else p.append(document.createRange().createContextualFragment(part));});
  body.append(p,checker(body,()=>grade(sels),render));
},
label(s,body,render){
  const words=s.items.slice().sort(),sels=[];const list=$('ol',{class:'labs'});
  s.items.forEach(a=>{const x=sel(words,a);sels.push(x);list.append($('li',{},x));});
  body.append($('div',{class:'label'},$('div',{class:'fig',html:s.svg}),list),checker(body,()=>grade(sels),render));
},
order(s,body,render){
  const rows=[],box=$('div',{class:'order'});
  shuffle(s.items).slice(0,s.take||99).forEach((sent,k)=>{
    const end=(sent.match(/[.?!]$/)||[''])[0],core=sent.replace(/[.?!]$/,''),words=core.split(' ');
    let toks=shuffle(words);for(let n=0;n<5&&toks.join(' ')===core;n++)toks=shuffle(words);
    const ans=$('div',{class:'ans'}),pool=$('div',{class:'pool'});
    toks.forEach(w=>{const c=$('button',{class:'chip',onclick(){(c.parentNode===pool?ans:pool).append(c);}},w);pool.append(c);});
    const fix=$('div',{class:'ofix'});
    rows.push({ans,core,fix,sent});box.append($('div',{class:'orow'},$('em',{},(k+1)+'.'),$('div',{class:'answ'},ans,$('span',{class:'end'},end)),pool,fix));
  });
  body.append(box,checker(body,()=>{let ok=0;rows.forEach(r=>{const got=[...r.ans.children].map(c=>c.textContent).join(' ');const g=norm(got)===norm(r.core);
    r.ans.classList.toggle('ok',g);r.ans.classList.toggle('bad',!g);r.fix.textContent=g?'':'→ '+r.sent;if(g&&!r.said){r.said=1;}if(g)ok++;});return[ok,rows.length];},render));
},
spell(s,body,render){
  const ins=[],g=$('div',{class:'spell'});
  shuffle(s.items).slice(0,s.take||10).forEach(([ru,en])=>{const i=$('input',{type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false'});i.dataset.a=en;ins.push(i);g.append($('label',{},$('span',{},ru),i));});
  body.append(g,checker(body,()=>grade(ins),render));
}};

function section(s,i){
  const box=$('section',{class:'ex c-'+(s.color||COLORS[i%4]),id:'ex'+(i+1)});
  const body=$('div',{class:'ex-body'});
  box.append(...[$('div',{class:'ex-head'},$('span',{class:'num'},String(i+1)),$('h2',{},s.title)),s.instr?$('p',{class:'instr',html:s.instr}):null,s.pre?$('div',{class:'read'},HAS_TTS?$('div',{class:'bar'},$('button',{class:'btn',onclick(){speak(box.querySelector('.read').innerText.replace('🔊 Listen',''));}},'🔊 Listen'),$('button',{class:'btn',onclick(){speechSynthesis.cancel();}},'⏹ Stop')):null,$('div',{html:s.pre})):null,body].filter(Boolean));
  const render=()=>{body.innerHTML='';R[s.type](s,body,render);};render();return box;
}
